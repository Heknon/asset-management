# VictoriaMetrics scrape config for local development (Prometheus-compatible).
# Covers both ways of running locally: `bun run dev` on the host (ports 4001-4004)
# and `docker compose --profile app` containers.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: asset-management-host
    static_configs:
      - targets: ['host.docker.internal:4001', 'host.docker.internal:4002', 'host.docker.internal:4003', 'host.docker.internal:4004']
  - job_name: asset-management-compose
    static_configs:
      - targets: ['identity:8080', 'registry:8080', 'files:8080', 'scheduler:8080']

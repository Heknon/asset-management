{{- $fullname := include "am.fullname" . -}}
{{- $web := dict "root" . "name" "web" -}}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "am.serviceAccountName" . }}
  labels:
    {{- include "am.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.secrets.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels:
    {{- include "am.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- if .Values.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "am.labels" . | nindent 4 }}
  annotations:
    haproxy.router.openshift.io/timeout: 60s
    {{- with .Values.route.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.route.host }}
  host: {{ . }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "am.component" $web }}
    weight: 100
  port:
    targetPort: http
  tls:
    {{- toYaml .Values.route.tls | nindent 4 }}
  wildcardPolicy: None
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "am.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "am.component" $web }}
                port: { name: http }
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# Default deny for the release; only the router reaches web, and only web
# (plus files → registry for access checks) reaches the backend services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-web-ingress
  labels:
    {{- include "am.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "am.selectorLabels" $web | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - { port: 8080, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-backend-ingress
  labels:
    {{- include "am.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name | quote }}] }
      - { key: app.kubernetes.io/component, operator: In, values: [identity, registry, files, scheduler] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- if .Values.observability.metrics.enabled }}
        # Metrics scrapers (Prometheus / vmagent) in the monitoring namespaces.
        - namespaceSelector:
            {{- toYaml .Values.observability.metrics.scraperNamespaceSelector | nindent 12 }}
        {{- end }}
      ports:
        - { port: 8080, protocol: TCP }
{{- end }}

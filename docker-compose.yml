# Local development.
#   docker compose up -d                 → Postgres, MinIO (S3), Mailpit (SMTP + inbox UI), OpenLDAP
#   bun run dev                          → services + web on http://localhost:5173
#   docker compose --profile app up -d   → also runs the production images (http://localhost:8080)
#   docker compose --profile observability up -d
#       → OTel Collector + Jaeger (http://localhost:16686), VictoriaMetrics, Grafana (http://localhost:3000)
#         then run services with METRICS_ENABLED=true OTEL_ENABLED=true (see README)
name: asset-management

x-service: &service
  profiles: [app]
  restart: unless-stopped
  env_file: .env.example
  environment: &service-env
    NODE_ENV: production
    MIGRATE_ON_START: 'true'
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/assets
    PUBLIC_URL: http://localhost:8080
    AUTH_JWKS_URL: http://identity:8080/api/identity/.well-known/jwks.json
    METRICS_ENABLED: ${METRICS_ENABLED:-true}
    OTEL_ENABLED: ${OTEL_ENABLED:-false}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  depends_on:
    postgres: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assets
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://localhost:8080
    ports: ['9000:9000', '9001:9001']
    volumes: [minio:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/assets; mc anonymous set none local/assets"

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ['1025:1025', '8025:8025']

  # Test directory: alice and bob (password "password"), both in
  # cn=procurement,ou=users,dc=example,dc=org. Bitnami's free images moved to bitnamilegacy.
  openldap:
    image: bitnamilegacy/openldap:2.6
    environment:
      LDAP_ROOT: dc=example,dc=org
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: adminpassword
      LDAP_USERS: alice,bob
      LDAP_PASSWORDS: password,password
      LDAP_GROUP: procurement
    ports: ['1389:1389']

  identity:
    <<: *service
    build: { context: ., target: service, args: { SERVICE: identity } }
    environment:
      <<: *service-env
      COOKIE_SECURE: 'false'
      LDAP_ENABLED: 'true'
      LDAP_URL: ldap://openldap:1389
      LDAP_BIND_DN: cn=admin,dc=example,dc=org
      LDAP_BIND_PASSWORD: adminpassword
      LDAP_USER_BASE_DN: ou=users,dc=example,dc=org
      LDAP_USERNAME_ATTRIBUTE: uid
      LDAP_DISPLAY_NAME_ATTRIBUTE: cn
      LDAP_GROUP_BASE_DN: ou=users,dc=example,dc=org
  registry:
    <<: *service
    build: { context: ., target: service, args: { SERVICE: registry } }
  files:
    <<: *service
    build: { context: ., target: service, args: { SERVICE: files } }
    environment:
      <<: *service-env
      REGISTRY_URL: http://registry:8080
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
  scheduler:
    <<: *service
    build: { context: ., target: service, args: { SERVICE: scheduler } }
    environment:
      <<: *service-env
      SMTP_URL: smtp://mailpit:1025
  # MCP server for AI assistants at http://localhost:8080/mcp.
  mcp:
    <<: *service
    build: { context: ., target: service, args: { SERVICE: mcp } }
    environment:
      <<: *service-env
  web:
    profiles: [app]
    build: { context: ., target: web }
    environment:
      S3_ORIGIN: http://localhost:9000
    ports: ['8080:8080']
    depends_on: [identity, registry, files, scheduler, mcp]

  # ─── Observability (opt-in profile) ────────────────────────────────────────
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.129.1
    command: ['--config=/etc/otelcol/config.yaml']
    volumes: ['./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro']
    ports: ['4317:4317', '4318:4318']
    depends_on: [jaeger]

  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.70.0
    environment: { COLLECTOR_OTLP_ENABLED: 'true' }
    ports: ['16686:16686']

  victoriametrics:
    profiles: [observability]
    image: victoriametrics/victoria-metrics:v1.120.0
    command: ['-promscrape.config=/etc/vm/scrape.yaml', '-retentionPeriod=14d']
    volumes: ['./deploy/observability/scrape.yaml:/etc/vm/scrape.yaml:ro', 'vmdata:/victoria-metrics-data']
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['8428:8428']

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.0.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/asset-management.json
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/helm/asset-management/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3000:3000']
    depends_on: [victoriametrics, jaeger]

volumes:
  pgdata:
  minio:
  vmdata:

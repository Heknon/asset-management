# Local development.
#   docker compose up -d                 → Postgres, MinIO (S3), Mailpit (SMTP + inbox UI), OpenLDAP
#   pnpm dev                             → services + web on http://localhost:5173
#   docker compose --profile app up -d   → also runs the production images (http://localhost:8080)
name: asset-management

x-service: &service
  profiles: [app]
  restart: unless-stopped
  env_file: .env.example
  environment: &service-env
    NODE_ENV: production
    MIGRATE_ON_START: 'true'
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/assets
    PUBLIC_URL: http://localhost:8080
    AUTH_JWKS_URL: http://identity:8080/api/identity/.well-known/jwks.json
  depends_on:
    postgres: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assets
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://localhost:8080
    ports: ['9000:9000', '9001:9001']
    volumes: [minio:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/assets; mc anonymous set none local/assets"

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ['1025:1025', '8025:8025']

  # Test directory: alice and bob (password "password"), both in
  # cn=procurement,ou=users,dc=example,dc=org. Bitnami's free images moved to bitnamilegacy.
  openldap:
    image: bitnamilegacy/openldap:2.6
    environment:
      LDAP_ROOT: dc=example,dc=org
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: adminpassword
      LDAP_USERS: alice,bob
      LDAP_PASSWORDS: password,password
      LDAP_GROUP: procurement
    ports: ['1389:1389']

  identity:
    <<: *service
    build: { context: ., target: service, args: { SERVICE: identity } }
    environment:
      <<: *service-env
      COOKIE_SECURE: 'false'
      LDAP_ENABLED: 'true'
      LDAP_URL: ldap://openldap:1389
      LDAP_BIND_DN: cn=admin,dc=example,dc=org
      LDAP_BIND_PASSWORD: adminpassword
      LDAP_USER_BASE_DN: ou=users,dc=example,dc=org
      LDAP_USERNAME_ATTRIBUTE: uid
      LDAP_DISPLAY_NAME_ATTRIBUTE: cn
      LDAP_GROUP_BASE_DN: ou=users,dc=example,dc=org
  registry:
    <<: *service
    build: { context: ., target: service, args: { SERVICE: registry } }
  files:
    <<: *service
    build: { context: ., target: service, args: { SERVICE: files } }
    environment:
      <<: *service-env
      REGISTRY_URL: http://registry:8080
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
  scheduler:
    <<: *service
    build: { context: ., target: service, args: { SERVICE: scheduler } }
    environment:
      <<: *service-env
      SMTP_URL: smtp://mailpit:1025
  web:
    profiles: [app]
    build: { context: ., target: web }
    environment:
      S3_ORIGIN: http://localhost:9000
    ports: ['8080:8080']
    depends_on: [identity, registry, files, scheduler]

volumes:
  pgdata:
  minio:

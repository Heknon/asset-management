# Pushes to dev deploy dev; pushes to master deploy production.
name: Deploy

on:
  push:
    branches: [dev, master]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Node too: the services run on Node in production and the web build's tools may call it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/asset-management
      - run: helm template assets deploy/helm/asset-management --kube-version 1.29.0 > /dev/null

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -recursive -check deploy/terraform
      - run: terraform init -backend=false && terraform validate
        working-directory: deploy/terraform/environments/production

  images:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        component: [identity, registry, files, scheduler, mcp, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.component == 'web' && 'web' || 'service' }}
          build-args: SERVICE=${{ matrix.component }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
